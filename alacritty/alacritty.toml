[general]
live_config_reload = true

[window]
padding = { x = 4, y = 4 }
dynamic_padding = false
opacity = 1.0

[font]
size = 12.0

[font.normal]
family = "Iosevka Nerd Font Mono"
style = "Regular"

[font.bold]
family = "Iosevka Nerd Font Mono"
style = "Bold"

[font.italic]
family = "Iosevka Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "Iosevka Nerd Font Mono"
style = "Bold Italic"

[cursor.style]
shape = "Block"
blinking = "Off"

[colors.primary]
background = "#111416"
foreground = "#eeeeec"

[colors.cursor]
cursor = "#bbbbbb"
text = "#ffffff"

[colors.selection]
text = "#333333"
background = "#eeeeec"

[colors.normal]
black = "#000000"
red = "#cd0000"
green = "#00cd00"
yellow = "#cdcd00"
blue = "#1093f5"
magenta = "#cd00cd"
cyan = "#00cdcd"
white = "#faebd7"

[colors.bright]
black = "#404040"
red = "#ff0000"
green = "#00ff00"
yellow = "#ffff00"
blue = "#11b5f6"
magenta = "#ff00ff"
cyan = "#00ffff"
white = "#ffffff"
